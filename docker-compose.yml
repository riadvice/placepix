services:
  placepix:
    build:
      context: .
      args:
        PORT: ${PORT:-3000}
    container_name: placepix
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
    volumes:
      - ./images:/app/images
      - ./.cache:/app/.cache
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
