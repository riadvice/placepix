name: Publish Docker image

# Tagged releases are built once here and pushed to Docker Hub. Production then
# only pulls: no source checkout and no build on the server.

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. 0.4)'
        required: true

env:
  IMAGE: riadvice/placepix

jobs:
  test:
    name: Test the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: placepix:test
          build-args: |
            GIT_VERSION=${{ github.event.inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate the publish on the same suite that runs locally, in the same image
      # layers that ship - not just on a separate pip install.
      - name: Run tests
        run: docker run --rm placepix:test --fast

  publish:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # Full history so the highest-tag check below can see every tag.
          fetch-depth: 0

      - name: Resolve tags to push
        id: tags
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Only move :latest when this really is the newest release, so
          # publishing a hotfix for an older line cannot roll production back.
          HIGHEST=$(git tag --list '[0-9]*' | sort -V | tail -n 1)
          if [ "$VERSION" = "$HIGHEST" ]; then
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION and moving :latest (highest tag)."
          else
            echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION only; :latest stays on $HIGHEST."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published \`${{ steps.tags.outputs.version }}\`"
            echo
            echo "Tags: \`${{ steps.tags.outputs.tags }}\`"
            echo
            echo "Deploy with:"
            echo '```bash'
            echo "cd /opt/placepix && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
