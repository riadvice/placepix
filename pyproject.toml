[project]
name = "placepix"
version = "1.0.0"
description = "A self-hosted placeholder image server inspired by lorem-server and picsum.photos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
    "pillow-avif-plugin>=1.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "boto3>=1.34.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.24.0",
]

[project.scripts]
placepix = "src.main:run"
