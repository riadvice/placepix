[project]
name = "placepix"
version = "1.0.0"
description = "A self-hosted placeholder image server inspired by lorem-server and picsum.photos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
placepic = "src.main:run"
