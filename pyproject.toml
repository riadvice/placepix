[project]
name = "placepix"
version = "1.0.0"
description = "A self-hosted placeholder image server inspired by lorem-server and picsum.photos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
    "pillow-avif-plugin>=1.5.5",
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.6",
    "boto3>=1.43.14",
    "apscheduler>=3.11.2",
    "requests>=2.34.2",
    "blurhash>=1.1.5",
    "markdown>=3.10.2",
    "pygments>=2.20.0",
    "multiavatar>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
    "ruff>=0.15.15",
]

[project.scripts]
placepix = "src.main:run"
placepix-stats = "src.admin:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (FLK-E501, FLK-E302, FLK-E303, FLK-E305, FLK-E402, FLK-W293)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting - PYL-C0412)
    "F",   # Pyflakes
]
ignore = []

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
