<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Camera icon -->
  <rect x="25" y="35" width="50" height="35" rx="5" fill="white" opacity="0.9"/>
  <circle cx="50" cy="52" r="12" fill="url(#grad)"/>
  <circle cx="50" cy="52" r="8" fill="white"/>
  <circle cx="65" cy="40" r="3" fill="url(#grad)"/>
  
  <!-- Sparkle effect -->
  <circle cx="75" cy="25" r="2" fill="white"/>
  <circle cx="80" cy="30" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="70" cy="30" r="1" fill="white" opacity="0.5"/>
</svg>
