<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#ffffff"/>
  
  <!-- Camera icon -->
  <rect x="25" y="35" width="50" height="35" rx="5" fill="url(#grad)" opacity="0.9"/>
  <circle cx="50" cy="52" r="12" fill="#ffffff"/>
  <circle cx="50" cy="52" r="8" fill="url(#grad)"/>
  <circle cx="65" cy="40" r="3" fill="url(#grad)"/>
  
  <!-- Border accent -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#grad)" stroke-width="2"/>
</svg>
