{# Color swatch partial - receives: item #}
{% set hex_color = item.hex %}
{% set count = item.count %}
<div class="swatch">
    <a href="/color/{{ hex_color.lstrip('#') }}/400/300" target="_blank">
        <div class="color-block" style="background: {{ hex_color }};"></div>
    </a>
    <div class="color-info">
        <code class="hex">{{ hex_color }}</code>
        <span class="count">{{ count }} image{% if count > 1 %}s{% endif %}</span>
    </div>
    <div class="samples">
        {% for sid in item.sample_ids[:2] %}
            <img src="/id/{{ sid }}/100/75" alt="" loading="lazy">
        {% endfor %}
    </div>
</div>
