coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 90%

ignore:
  - "tests/"
  - "**/__pycache__/"
  - "**/*.egg-info/"
  - ".venv/"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
